server {
    listen 80;
    server_name _;

    # GitHub -> Hermes webhook bridge.
    # /hooks/<...> -> Hermes gateway webhook adapter (host network :8644).
    location /hooks/ {
        proxy_pass http://10.0.3.2:8644/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_read_timeout 60s;
    }

    # Bridge self-check (does not touch the gateway).
    location = /healthz { return 200 "bridge ok\n"; add_header Content-Type text/plain; }
}
