server {
    listen 80;
    server_name _;

    # GitHub -> Hermes webhook bridge.
    # Request-time resolution via docker embedded DNS (127.0.0.11) so nginx
    # starts even when the upstream is briefly unreachable.
    # Two route shapes upstream:
    #   default-profile routes:      /webhooks/<name>
    #   multiplexed profile routes:  /p/<profile>/webhooks/<name>
    # So /hooks/<name> -> /webhooks/<name>, but /hooks/p/... keeps its prefix.
    location /hooks/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hermes_upstream http://hermes-kbu4wj0evr6if4mjcjzj5ssg:8644;
        rewrite ^/hooks/(p/.*)$ /$1 break;
        rewrite ^/hooks/(.*)$ /webhooks/$1 break;
        proxy_pass $hermes_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_read_timeout 60s;
    }

    location = /healthz { return 200 "bridge ok\n"; add_header Content-Type text/plain; }
}
